name: Release

# On every merge to main (changesets/action):
#   - pending changesets -> opens/updates a "Version Packages" PR (version bump +
#     CHANGELOG). main is protected, so nothing is pushed to it directly.
#   - that PR merged (no pending changesets) -> builds, publishes to npm, tags
#     vX.Y.Z and creates the GitHub release from the CHANGELOG.
# npm publishing uses trusted publishing (OIDC): configure this workflow as a
# Trusted Publisher in the package's npm settings, no npm token needed.
# Repo setting required: Actions > "Allow GitHub Actions to create and approve
# pull requests". Optional RELEASE_TOKEN (PAT) makes CI run on the version PR,
# since PRs opened with GITHUB_TOKEN do not trigger workflows.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

env:
  HUSKY: '0'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm test
      - uses: changesets/action@v1
        with:
          version: npm run version
          publish: npm run release
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
