name: Release

# On every merge to main (changesets/action):
#   - pending changesets -> opens/updates a "Version Packages" PR (version bump +
#     CHANGELOG). main is protected, so nothing is pushed to it directly.
#   - that PR merged (no pending changesets) -> builds, publishes to npm, tags
#     vX.Y.Z and creates the GitHub release from the CHANGELOG.
# npm publishing uses trusted publishing (OIDC): configure this workflow as a
# Trusted Publisher in the package's npm settings, no npm token needed.
# Repo setting required: Actions > "Allow GitHub Actions to create and approve
# pull requests". Optional RELEASE_TOKEN (PAT) makes CI run on the version PR,
# since PRs opened with GITHUB_TOKEN do not trigger workflows.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

env:
  HUSKY: '0'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm test
      - uses: changesets/action@v2.1.2
        id: changesets
        with:
          version: npm run version
          publish: npm run release
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          NPM_CONFIG_PROVENANCE: 'true'
      # @changesets/cli 3 no longer prints the "New tag:" lines changesets/action
      # parses, so the action never pushes the tag nor creates the GitHub release.
      # Do it here once the current version is on npm (idempotent).
      - name: Tag and create GitHub release
        if: steps.changesets.outputs.hasChangesets == 'false'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"; exit 0
          fi
          if [ "$(npm view "$NAME@$VERSION" version 2>/dev/null)" != "$VERSION" ]; then
            echo "$NAME@$VERSION is not on npm, nothing to release"; exit 0
          fi
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || git tag "$TAG"
          git push origin "refs/tags/$TAG"
          awk -v v="$VERSION" '/^## /{if(f)exit; if($2==v)f=1; next} f' CHANGELOG.md > release-notes.md
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --verify-tag
