name: Release

# On every merge to main: build and test, then, if changesets are pending, bump
# the version, publish to npm, push the release commit + tag and create a
# GitHub release. Publishing to npm uses trusted publishing (OIDC): configure
# this workflow as a Trusted Publisher on the package's npm settings page, no
# npm token needed. RELEASE_TOKEN (a PAT allowed to bypass branch protection)
# is needed if main is protected.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  HUSKY: '0'

jobs:
  release:
    # The release commit itself must not trigger another release.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release)') }}
    runs-on: ubuntu-latest
    # Job-level permissions replace the top-level ones, so contents is repeated.
    # id-token lets npm trusted publishing (OIDC) authenticate the publish.
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The release commit + tag are pushed to a protected main. The default
          # GITHUB_TOKEN cannot be added to a ruleset bypass list, so use a
          # fine-grained PAT (Contents: read/write) from a repo admin.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: bash scripts/release.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
