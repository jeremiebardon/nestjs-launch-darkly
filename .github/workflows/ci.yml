name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: '0'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:cov

  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Lint commit messages (conventional commits)
        run: >
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

  # Warns (does not block) when a PR changes the published package without a
  # changeset, Renovate PRs included. Source and build config are matched by
  # changedFilePatterns in .changeset/config.json; package.json is checked below.
  changeset-status:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx changeset status --since="origin/$BASE_REF"
      # Dev tooling and the version bump of the release PR don't reach consumers.
      - name: Check package.json fields that reach consumers
        run: |
          shipped='const { version, scripts, devDependencies, jest, ...rest } = JSON.parse(require("fs").readFileSync(0)); JSON.stringify(rest)'
          before=$(git show "origin/$BASE_REF:package.json" | node -p "$shipped")
          after=$(node -p "$shipped" < package.json)
          added=$(git diff --name-only --diff-filter=A "origin/$BASE_REF...HEAD" -- '.changeset/*.md')
          if [ "$before" != "$after" ] && [ -z "$added" ]; then
            echo "::error::package.json changes the published package but this PR has no changeset. Run npm run changeset."
            exit 1
          fi
