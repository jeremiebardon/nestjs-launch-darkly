name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: '0'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:cov

  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Lint commit messages (conventional commits)
        run: >
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

  # Warns (does not block) when a PR changes the published package (src/ or
  # package.json) without a changeset. CI, docs and tooling changes are skipped.
  changeset-status:
    # Renovate bumps are skipped; add a changeset by hand when one changes the runtime.
    if: github.actor != 'renovate[bot]'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: scope
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -qE '^(src/|package\.json$)'; then
            echo "affects_package=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.scope.outputs.affects_package == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - if: steps.scope.outputs.affects_package == 'true'
        run: npm ci
      - if: steps.scope.outputs.affects_package == 'true'
        run: npx changeset status --since=origin/${{ github.base_ref }}
